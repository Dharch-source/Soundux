on:
  push:
    branches: [master]
    paths-ignore:
      - "**/README.md"
      - "**/.all-contributorsrc"
  workflow_dispatch:

name: Build Windows portable

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build deps
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress
          choco install innosetup --yes --no-progress

      - name: Compile Embed-Helper
        shell: pwsh
        run: |
          cd src/ui/impl/webview/lib/webviewpp/embed-helper
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release

      - name: Generate embedded UI header
        shell: pwsh
        run: |
          cd src/ui/impl/webview/lib/webviewpp/embed-helper/build/Release
          ./embed_helper.exe ../../../../soundux-ui
          Get-ChildItem | Format-Table Name, Length

      - name: Compile Soundux
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. -DEMBED_PATH="$env:GITHUB_WORKSPACE\src\ui\impl\webview\lib\webviewpp\embed-helper\build\Release"
          cmake --build . --config Release

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse build\Release | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundux-windows
          path: build/Release
          if-no-files-found: error
          retention-days: 14

      - name: Run InnoSetup
        shell: pwsh
        run: |
          $iss = Get-Content deployment/innosetup/Soundux.iss -Raw
          $iss = $iss -replace '%\$PATH%', "$env:GITHUB_WORKSPACE"
          Set-Content deployment/innosetup/Soundux.iss -Value $iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" deployment/innosetup/Soundux.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundux-installer
          path: deployment/innosetup/Output/setup.exe
          if-no-files-found: warn
          retention-days: 14
