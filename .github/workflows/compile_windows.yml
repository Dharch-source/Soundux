on:
  push:
    branches: [master]
    paths-ignore:
      - "**/README.md"
      - "**/.all-contributorsrc"
  workflow_dispatch:

name: Build Windows portable

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build deps
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress
          choco install innosetup --yes --no-progress

      - name: Compile Embed-Helper
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd src/ui/impl/webview/lib/webviewpp/embed-helper
          mkdir build
          cd build
          cmake .. "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build . --config Release

      - name: Generate embedded UI header
        shell: pwsh
        run: |
          cd src/ui/impl/webview/lib/webviewpp/embed-helper/build/Release
          ./embed_helper.exe ../../../../soundux-ui
          Get-ChildItem | Format-Table Name, Length

      - name: Compile Soundux
        shell: pwsh
        run: |
          mkdir build
          cd build
          $embed = "$env:GITHUB_WORKSPACE\src\ui\impl\webview\lib\webviewpp\embed-helper\build\Release"
          cmake .. "-DEMBED_PATH=$embed" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build . --config Release

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse build\Release | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundux-windows
          path: build/Release
          if-no-files-found: error
          retention-days: 14

      - name: Run InnoSetup
        shell: pwsh
        run: |
          $issPath = "deployment/innosetup/Soundux.iss"
          $iss = Get-Content $issPath -Raw
          # $PATH is the CI placeholder the upstream sed step replaced with the
          # checkout root. String.Replace is literal, so no regex escaping here.
          $iss = $iss.Replace('$PATH', $env:GITHUB_WORKSPACE)
          # choco innosetup ships only the default language file. Upstream's .iss
          # lists 20+ MessagesFile compiler:Languages\*.isl paths, all of which are
          # missing here, so drop every [Languages] row except the default.
          $iss = ($iss -split "`r`n" | Where-Object {
            $_ -notmatch 'MessagesFile:\s*"compiler:Languages\\'
          }) -join "`r`n"
          Set-Content $issPath -Value $iss -NoNewline
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" $issPath

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundux-installer
          path: deployment/innosetup/Output/setup.exe
          if-no-files-found: warn
          retention-days: 14
